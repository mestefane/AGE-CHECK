<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilo.css">
    <title>Verificador de idade</title>
</head>
<body>
    <header>
        <h1>AGE CHECK  </h1>
         <p>Verificador  de idade</p>
    </header>
    <section>
        <div id="dados">
            <h2>Dados</h2>
             <p>Digite o ano do Nascimento:</p>
                <input type="number" name="txtano" id="txtano" min="0" placeholder="Ex: 2001">
        
            <p>Sexo:</p>
                <input type="radio" name="radsex" id="mas" checked>
                <label for="mas">Masculino</label>
                <input type="radio" name="radsex" id="fem">
                <label for="fem">Feminino</label>
            <p>
                <input type="button"  class="btn-verificar" value="Verificar" onclick="verificar()">
            </p>
        </div>
        <div id="res">
                Preencha os dados  para ver resultado!   
        </div>
    </section>
    <footer>
        <p>&copy; Desenvolvido por M.Estefane </p>
    </footer>
    <script src="script.js"> </script>
</body>
</html>
